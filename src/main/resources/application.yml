  #   username: ${MAIL_EMAIL}
  #   password: ${MAIL_PASSWORD}
  #   properties:
  #     mail:
  #       smtp:
  #         auth: true
  #         starttls:
  #           enable: true
  #           required: true
  #         ssl:
  #           enable: false
  #           trust: smtp.naver.com
  #         connectiontimeout: 30000
  #         timeout: 30000
  # ---------------------------------------------


logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicExtractor: trace

app:
  base-url: https://lineup-maker-api.onrender.com
