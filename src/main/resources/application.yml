jwt:
  secret: ${JWT_SECRET_KEY}
  expiration: ${JWT_EXPIRATION_SECONDS}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_SECONDS}

spring:
  profiles:
    active: dev # 기본 프로필을 dev로 설정
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            scope:
              - profile_nickname
            client-name: Kakao
            authorization-grant-type: authorization_code # ✨ [추가] Spring Security 자동 설정을 위한 필수 값
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}?prepareThreshold=0
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}

  jpa:
    hibernate:
      ddl-auto: validate
    # database-platform: org.hibernate.dialect.PostgreSQLDialect # ✨ [제거] 불필요한 경고를 유발하므로 삭제

app:
  base-url: https://lineup-maker-api.onrender.com
  #base-url: http://localhost:8080
  oauth2:
    # ✨ [배포 설정] 실제 배포된 프론트엔드 주소로 변경 (Vercel 주소)
  health-check-key: ${HEALTH_SECRET_TOKEN}
