# 모든 환경(dev, prod)에 공통으로 적용되는 기본 설정

jwt:
  secret: ${JWT_SECRET_KEY}
  expiration: ${JWT_EXPIRATION_SECONDS}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_SECONDS}

server:
  port: ${PORT:8080}
  forward-headers-strategy: NATIVE
  # server.address는 각 프로필(dev, prod)에서 정의

kakao:
  admin:
    key: ${KAKAO_ADMIN_KEY}

spring:
  main:
    lazy-initialization: true
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
    default-property-inclusion: non_null
    time-zone: UTC
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            scope:
              - profile_nickname
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 180000
      max-lifetime: 300000
      data-source-properties:
        prepareThreshold: 0

  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}
      password: ${SPRING_REDIS_PASSWORD}
      ssl:
        enabled: ${SPRING_REDIS_SSL_ENABLED}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

app:
  # app.base-url은 각 프로필(dev, prod)에서 정의
  health-check-key: ${HEALTH_SECRET_TOKEN}
