jwt:
  secret: ${JWT_SECRET_KEY}
  expiration: ${JWT_EXPIRATION_SECONDS}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_SECONDS}

server:
  port: 8080 # ✨ [추가] Render의 포트 감지 경고를 없애기 위해 명시적으로 포트 설정

kakao:
  admin:
    key: ${KAKAO_ADMIN_KEY}

spring:
  profiles:
    active: dev # 기본 프로필을 dev로 설정
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            scope:
              - profile_nickname
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}?prepareThreshold=0
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}

  jpa:
    hibernate:
      ddl-auto: validate

app:
  base-url: https://lineup-maker-api.onrender.com
  #base-url: http://localhost:8080
  oauth2:
    # ✨ [배포 설정] 실제 배포된 프론트엔드 주소로 변경 (Vercel 주소)
  health-check-key: ${HEALTH_SECRET_TOKEN}
