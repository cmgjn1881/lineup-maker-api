jwt:
  secret: ${JWT_SECRET_KEY}
  expiration: ${JWT_EXPIRATION_SECONDS}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_SECONDS}

spring:
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            # ✨ [배포 설정] 실제 배포된 백엔드 주소로 변경
            redirect-uri: https://lineup-maker-api.onrender.com/login/oauth2/code/kakao
            scope:
              - profile_nickname
            client-name: Kakao

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0

  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}

  jpa:
    hibernate:
      ddl-auto: validate # ✨ [배포 주의] 운영 환경에서는 'update' 대신 'validate' 또는 'none'을 권장합니다.
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate.format_sql: true
      hibernate.show_sql: true

logging:
  level:
    org.hibernate.SQL: info # 배포환경에서는 INFO, WARN 개발환경 debug
    org.hibernate.type.descriptor.sql.BasicExtractor: info # 배포환경에서는 INFO, WARN
    org.springframework.security: info

app:
  base-url: https://lineup-maker-api.onrender.com
  #base-url: http://localhost:8080
  oauth2:
    # ✨ [배포 설정] 실제 배포된 프론트엔드 주소로 변경 (Vercel 주소)

  health-check-key: ${HEALTH_SECRET_TOKEN}
