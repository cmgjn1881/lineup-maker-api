jwt:
  secret: ${JWT_SECRET_KEY}
  expiration: ${JWT_EXPIRATION_SECONDS}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_SECONDS}

server:
  port: ${PORT:8080}
  forward-headers-strategy: NATIVE

kakao:
  admin:
    key: ${KAKAO_ADMIN_KEY}

spring:
  # [최종 해결책] 지연 초기화 설정
  # 애플리케이션 시작 시 DB 커넥션 풀을 생성하지 않고, 첫 요청 시 생성하도록 변경
  # Render + Supabase 무료 플랜의 배포 시점 커넥션 한도 초과 문제를 회피하기 위함
  main:
    lazy-initialization: true
  profiles:
    active: dev # 기본 프로필을 dev로 설정
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
    default-property-inclusion: non_null
    time-zone: UTC
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            scope:
              - profile_nickname
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 900000
      data-source-properties:
        prepareThreshold: 0

  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}
      password: ${SPRING_REDIS_PASSWORD}
      ssl:
        enabled: ${SPRING_REDIS_SSL_ENABLED}

  jpa:
    hibernate:
      # [최종 해결책] 시작 시 스키마 검증을 하지 않도록 변경하여 DB 연결 시도 자체를 방지
      ddl-auto: none
    # DB 종류를 명시적으로 설정하여 시작 시 불필요한 메타데이터 조회를 생략
    database-platform: org.hibernate.dialect.PostgreSQLDialect

app:
  base-url: https://lineup-maker-api.onrender.com
  #base-url: http://localhost:8080
  oauth2:
    # ✨ [배포 설정] 실제 배포된 프론트엔드 주소로 변경 (Vercel 주소)
  health-check-key: ${HEALTH_SECRET_TOKEN}
