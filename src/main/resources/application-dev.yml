# 로컬 개발 환경용 설정
app:
  base-url: http://localhost:8080

spring:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true # SQL 로그를 예쁘게 포맷팅
        show_sql: true   # 실행되는 SQL 로그를 콘솔에 출력

logging:
  level:
    org.hibernate.type.descriptor.sql: trace # SQL 파라미터 값까지 로그로 확인
